version: '3.8'

services:
  # 1. خادم تطبيق ماي أودت السحابي (My Audit Application)
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: myaudit_cloud_app
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://audit_user:SecurePass2026@postgres:5432/myaudit_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=s3
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET_NAME=my-audit-evidence
      - SECRET_KEY=my-audit-cloud-secret-token-key-2026-sa
      - DATA_RESIDENCY_REGION=sa-central-1
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"
    networks:
      - audit_network

  # 2. قاعدة البيانات السحابية (Managed PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: myaudit_postgres
    restart: always
    environment:
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: SecurePass2026
      POSTGRES_DB: myaudit_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - audit_network

  # 3. التخزين المؤقت وطوابير المهام السحابية (Redis Cache & Queue)
  redis:
    image: redis:7-alpine
    container_name: myaudit_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - audit_network

  # 4. مخزن الكائنات السحابية المتوافق مع S3 (MinIO Object Storage للأدلة)
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: myaudit_minio_s3
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - audit_network

  # 5. البوابة الأمنية وخادم العكس (Nginx Reverse Proxy & SSL)
  nginx:
    image: nginx:alpine
    container_name: myaudit_nginx_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - audit_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  audit_network:
    driver: bridge
